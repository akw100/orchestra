<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FX Harness</title>
<link rel="stylesheet" href="../../theme.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--stage-bg); color: var(--ink); font: 13px/1.3 var(--font-body); }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: fixed; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: min(560px, calc(100vw - 24px));
        background: color-mix(in srgb, var(--surface) 82%, transparent); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  #ui button { font: inherit; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); cursor: pointer; }
  #ui button.on { background: var(--accent); color: var(--accent-ink); }
  #ui label { display: inline-flex; align-items: center; gap: 6px; padding: 0 4px; }
  #ui input[type=range] { width: 110px; }
  #stats { position: fixed; right: 12px; bottom: 12px; font: 12px ui-monospace, monospace; background: var(--surface); border: 1px solid var(--line); padding: 6px 8px; border-radius: 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button data-fx="note">♪ note</button>
  <button data-fx="ring">ring</button>
  <button data-fx="sparkle">sparkle</button>
  <button data-fx="goldrain">gold rain</button>
  <button data-fx="pulse">pulse</button>
  <button id="beams" class="on">beams</button>
  <button id="auto">auto play</button>
  <button id="spam">spam</button>
  <button id="theme">theme</button>
  <label>level <input id="level" type="range" min="0" max="1" step="0.01" value="0.4"></label>
  <label>tutti <input id="tutti" type="range" min="0" max="1" step="0.01" value="0"></label>
</div>
<div id="stats">…</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createFX } from '../fx.js';
import { createPost } from '../post.js';

const qs = new URLSearchParams(location.search);
const root = document.documentElement;
if (qs.get('theme')) root.dataset.theme = qs.get('theme');

const TOKS = ['bg', 'surface', 'surface-2', 'ink', 'ink-muted', 'line', 'accent', 'accent-hi', 'accent-lo', 'accent-ink', 'velvet', 'velvet-hi', 'velvet-lo', 'glow', 'stage-bg', 'stage-floor', 'shadow', 'hue-s', 'hue-l', 'hue-l-fill', 'on-hue'];
function readTok() {
  const cs = getComputedStyle(root), tok = { theme: root.dataset.theme || 'dark' };
  for (const n of TOKS) tok[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = cs.getPropertyValue('--' + n).trim();
  return tok;
}

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 5.2, 13.5);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.2, -4); controls.enableDamping = true; controls.update();

// --- a stage-ish set built from the coordinate contract ---
const M = {
  floor: new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0.05 }),
  riser: new THREE.MeshStandardMaterial({ roughness: 0.6 }),
  wall: new THREE.MeshStandardMaterial({ roughness: 0.95 }),
  house: new THREE.MeshStandardMaterial({ roughness: 1 }),
};
const floor = new THREE.Mesh(new THREE.BoxGeometry(19, 0.3, 11.2), M.floor); floor.position.set(0, -0.15, -5.5); scene.add(floor);
const apron = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 0.3, 48, 1, false, -Math.PI / 2, Math.PI), M.floor); apron.position.set(0, -0.15, 0); scene.add(apron);
const house = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), M.house); house.rotation.x = -Math.PI / 2; house.position.set(0, -1.1, 10); scene.add(house);
const back = new THREE.Mesh(new THREE.PlaneGeometry(26, 14), M.wall); back.position.set(0, 7, -11.2); scene.add(back);
for (const s of [-1, 1]) { const w = new THREE.Mesh(new THREE.PlaneGeometry(13, 14), M.wall); w.rotation.y = -s * Math.PI / 2; w.position.set(9.8 * s, 7, -5); scene.add(w); }
const C = new THREE.Vector3(0, 0, 1.6);
for (let t = 1; t <= 4; t++) {
  const R = 4.2 + 1.55 * t, span = (78 - 7 * t) * Math.PI / 180, r0 = R - 0.78, r1 = R + 0.77;
  const sh = new THREE.Shape();
  const N = 40;
  for (let i = 0; i <= N; i++) { const a = -span + (2 * span * i) / N; const p = [r1 * Math.sin(a), r1 * Math.cos(a)]; i ? sh.lineTo(...p) : sh.moveTo(...p); }
  for (let i = N; i >= 0; i--) { const a = -span + (2 * span * i) / N; sh.lineTo(r0 * Math.sin(a), r0 * Math.cos(a)); }
  const g = new THREE.ExtrudeGeometry(sh, { depth: 0.32 * t, bevelEnabled: false, curveSegments: 1 });
  g.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, M.riser); m.position.copy(C); scene.add(m);
}
const podium = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.55, 0.22, 32), M.riser); podium.position.set(0, 0.11, 0.9); scene.add(podium);

// musicians: capsule figures on the tiers, coloured by hue
const players = [];
const hues = [8, 28, 48, 140, 190, 215, 260, 300, 340];
const seatAt = (t, a) => { const R = 4.2 + 1.55 * t, r = a * Math.PI / 180; return new THREE.Vector3(C.x + R * Math.sin(r), 0.32 * t, C.z - R * Math.cos(r)); };
let hi = 0;
for (let t = 0; t <= 4; t++) {
  const span = 78 - 7 * t, n = 3 + t;
  for (let i = 0; i < n; i++) {
    const a = -span * 0.85 + (span * 1.7 * i) / Math.max(n - 1, 1);
    const pos = seatAt(t, a), hue = hues[hi++ % hues.length];
    const mat = new THREE.MeshStandardMaterial({ roughness: 0.5 });
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 0.7, 4, 12), mat); body.position.set(pos.x, pos.y + 0.6, pos.z);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), mat); head.position.set(pos.x, pos.y + 1.2, pos.z);
    scene.add(body, head);
    players.push({ pos, hue, mat, beam: null, color: new THREE.Color() });
  }
}
const conductor = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 0.9, 4, 12), new THREE.MeshStandardMaterial({ color: 0x222222 }));
conductor.position.set(0, 0.22 + 0.65, 0.9); scene.add(conductor);

const hemi = new THREE.HemisphereLight(0xffffff, 0x302018, 0.9); scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff0dd, 1.4); key.position.set(3, 10, 8); scene.add(key);

// --- fx + post under test ---
const reducedMotion = qs.get('rm') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches;
const quality = qs.get('q') === 'low' ? 'low' : 'high';
const ctx = { THREE, scene, camera, renderer, canvas, tok: readTok(), reducedMotion, quality, addons: (p) => import('three/addons/' + p) };
const fx = createFX(ctx);
const post = createPost(ctx);
window.fx = fx; window.post = post; window.ctx = ctx;

function theme() {
  const tok = readTok(); ctx.tok = tok;
  const dark = tok.theme !== 'light';
  scene.background = new THREE.Color().setStyle(tok.stageBg);
  M.floor.color.setStyle(tok.stageFloor);
  M.riser.color.setStyle(tok.stageFloor).multiplyScalar(dark ? 0.8 : 0.9);
  M.wall.color.setStyle(tok.velvetLo);
  M.house.color.setStyle(tok.bg);
  hemi.intensity = dark ? 0.35 : 1.6; key.intensity = dark ? 0.6 : 2.2;
  for (const p of players) { p.color.setStyle(`hsl(${p.hue}, ${tok.hueS}, ${tok.hueL})`); p.mat.color.setStyle(`hsl(${p.hue}, ${tok.hueS}, ${tok.hueLFill})`); }
  fx.applyTheme(tok); post.applyTheme(tok);
}
theme();

// beams over a handful of players
const rig = (p) => new THREE.Vector3(p.pos.x * 0.7, 8.6, p.pos.z + 3.2);
let beamsOn = true;
for (const p of players.filter((_, i) => i % 3 === 0)) { p.beam = fx.beam(rig(p), p.pos, { angle: 9 }); p.beam.setIntensity(0.9); }
const condBeam = fx.beam(new THREE.Vector3(0, 9, 4), new THREE.Vector3(0, 0.22, 0.9), { angle: 7 }); condBeam.setIntensity(1);

const pick = () => players[(Math.random() * players.length) | 0];
const head = (p) => new THREE.Vector3(p.pos.x, p.pos.y + 1.45, p.pos.z);
function fire(type, p = pick()) {
  if (type === 'note') fx.emit('note', { position: head(p), color: p.color, vel: 0.5 + Math.random() * 0.5, midi: 40 + ((Math.random() * 50) | 0) });
  else if (type === 'ring') fx.emit('ring', { position: p.pos, color: p.color, vel: 0.6 + Math.random() * 0.4 });
  else if (type === 'sparkle') fx.emit('sparkle', { position: head(p), color: p.color, vel: 0.8 });
  else if (type === 'goldrain') fx.emit('goldrain', {});
  else if (type === 'pulse') fx.emit('pulse', { strength: 1 });
}
document.querySelectorAll('[data-fx]').forEach((b) => b.addEventListener('click', () => fire(b.dataset.fx)));
const tog = (id, on) => { const b = document.getElementById(id); b.classList.toggle('on', on); return on; };
let auto = false, spam = false;
document.getElementById('auto').onclick = () => { auto = tog('auto', !auto); };
document.getElementById('spam').onclick = () => { spam = tog('spam', !spam); };
document.getElementById('beams').onclick = () => {
  beamsOn = tog('beams', !beamsOn);
  for (const p of players) p.beam?.setIntensity(beamsOn ? 0.9 : 0);
  condBeam.setIntensity(beamsOn ? 1 : 0);
};
document.getElementById('theme').onclick = () => { root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light'; theme(); };
const levelEl = document.getElementById('level'), tuttiEl = document.getElementById('tutti');

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  post.setSize(innerWidth, innerHeight);
});

// --- frame loop ---
const stats = document.getElementById('stats');
let last = performance.now(), t = 0, beat = 0, lastBeatInt = -1, acc = 0, cpuAcc = 0, n = 0, worst = 0;
const bpm = 96;
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now; t += dt;
  beat = (beat + dt * bpm / 60) % 16;
  const level = auto || spam ? 0.35 + 0.35 * Math.abs(Math.sin(t * 1.3)) : +levelEl.value;
  const frame = { t, dt, level, bands: { low: level, mid: level, high: level * 0.7 }, beat, bpm, playing: auto ? 12 : 0, total: players.length, tutti: +tuttiEl.value, theme: root.dataset.theme };
  const bi = Math.floor(beat);
  if (bi !== lastBeatInt) {
    lastBeatInt = bi;
    if (auto || spam) {
      if (bi % 4 === 0) fire('pulse');
      for (let k = 0; k < (spam ? 10 : 3); k++) fire('note');
      if (bi % 2 === 0) fire('ring');
      if (spam) { fire('sparkle'); fire('sparkle'); fire('ring'); }
      if (spam && bi === 0) fire('goldrain');
    }
  }
  if (spam) for (let k = 0; k < 3; k++) fire('note');
  controls.update();
  const c0 = performance.now();
  fx.update(frame);
  post.render(frame);
  const c1 = performance.now();
  acc += dt; cpuAcc += c1 - c0; n++; worst = Math.max(worst, dt * 1000);
  if (acc > 0.5) {
    stats.textContent = `${(acc * 1000 / n).toFixed(1)} ms/frame · cpu ${(cpuAcc / n).toFixed(2)} ms · worst ${worst.toFixed(0)} ms · post ${post.enabled ? 'on' : 'off'} · ${quality}${reducedMotion ? ' · rm' : ''}`;
    window.__stats = { frameMs: acc * 1000 / n, cpuMs: cpuAcc / n, worst };
    acc = 0; cpuAcc = 0; n = 0; worst = 0;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
